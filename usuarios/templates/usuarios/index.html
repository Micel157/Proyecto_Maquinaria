<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Alquiler - Inicio</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de navegación superior -->
    <header class="bg-white shadow-sm py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="fs-4 fw-bold text-primary">Alquiler de Maquinaria</span>
            <div>
                <!-- Puedes cambiar estos enlaces o borrarlos si luego usas el sistema de rutas -->
                <a href="#" class="btn btn-outline-primary btn-sm me-2">Iniciar Sesión</a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal (Hero Section) -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <div class="p-5 bg-white rounded-4 shadow-sm border">
                    
                    <!-- Título principal grande y sobrio -->
                    <h1 class="display-4 fw-bold text-dark mb-3">Bienvenido</h1>
                    
                    <!-- Eslogan referente a la construcción y maquinaria -->
                    <p class="lead text-secondary fst-italic mb-4">
                        &ldquo;Movilizando el futuro de la construcción: potencia, precisión y rendimiento eficiente en cada proyecto con nuestra flota de maquinaria pesada.&rdquo;
                    </p>
                    
                    <hr class="w-25 mx-auto my-4 text-muted">

                    <!-- Botones de acción rápida opcionales -->
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a href="#" class="btn btn-primary btn-lg px-4 gap-3">Ver Catálogo</a>
                        <a href="#" class="btn btn-outline-secondary btn-lg px-4">Contact soporte</a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="text-center py-3 text-muted border-top bg-white mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 Proyecto Alquiler. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN (por si agregas componentes interactivos como modales o alertas) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
